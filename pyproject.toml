[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepse-index-scraper"
version = "1.0.0"
description = "Scrape NEPSE index and sub-index history from ShareSansar into CSV files (GitHub Actions + local clone)."
requires-python = ">=3.10"
dependencies = ["playwright>=1.44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nepse-scraper = "nepse_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
