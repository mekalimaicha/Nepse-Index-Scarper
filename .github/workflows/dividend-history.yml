name: Dividend History (daily 12:00 AM NPT)

# Scrapes https://hamroshare.com.np/investment/proposed-dividend (all FY tabs) and merges the result into
# data/fundamental/"Dividend History.csv" (manual data is preserved - see src/nepse_scraper/dividends.py).
#   - Run manually any time: Actions -> this workflow -> Run workflow.
#   - Runs automatically every day at 12:00 AM Nepal time (18:15 UTC).
# Your laptop picks up the commit automatically (login sync, 5-minute check, 17:00 sync).

on:
  schedule:
    - cron: "15 18 * * *"      # 18:15 UTC = 00:00 NPT
  workflow_dispatch:
    inputs:
      force:
        description: "Allow an unusually large number of new rows"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  dividend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Scrape and merge Dividend History
        run: python -m nepse_scraper dividend ${{ inputs.force && '--force' || '' }}

      - name: Upload debug dumps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: logs/
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name  "nepse-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: dividend history $(TZ=Asia/Kathmandu date +%F)"
            git pull --rebase
            git push
          fi
