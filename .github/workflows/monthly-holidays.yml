name: Monthly holiday archive

on:
  schedule:
    - cron: "0 3 1 * *"      # 1st of every month, 08:45 NPT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  holidays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Scrape holiday list (all years, AD)
        run: python -m nepse_scraper holidays

      - name: Upload debug dumps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: logs/
          if-no-files-found: ignore

      - name: Commit archive
        if: always()
        run: |
          git config user.name  "nepse-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/holidays
          if git diff --cached --quiet; then
            echo "No holiday changes."
          else
            git commit -m "data: holiday archive $(TZ=Asia/Kathmandu date +%Y-%m)"
            git pull --rebase
            git push
          fi
